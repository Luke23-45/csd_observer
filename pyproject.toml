[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csd_observer"
version = "0.2.0"
description = "Persistence-aware evaluation protocol for critical-slowing-down early-warning observers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "requests>=2.28.0",
    "nptdms>=1.7.0",
    "filelock>=3.8.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
csd-observer = "csd_observer.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csd_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
