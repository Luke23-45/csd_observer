# Indicator parameter blocks keyed by each method's ``config_path``
# (§10.1): ``IndicatorMethod`` resolves ``cfg["model"][<key>]`` and the
# seven per-method files mirror these blocks exactly.
var_csd:
  window_size: 30
ac1_csd:
  window_size: 30
skew_csd:
  window_size: 30
sratio_csd:
  window_size: 30
retrate_csd:
  window_size: 30
dfa_csd:
  window_size: 100
dmd_csd:
  window_size: 30
  embedding_dim: 6
  rank: 2

lstm:
  # ``in_channels`` omitted: schema default ``null`` means "auto" —
  # the runner infers the channel count from the dataset bundle.
  hidden_size: 64
  num_layers: 1
  dropout: 0.1

tcn:
  hidden_size: 32
  kernel_size: 5
  levels: 3

patchtst:
  # ``in_channels`` omitted: schema default ``null`` means "auto".
  patch_len: 16
  stride: 16
  d_model: 64
  n_heads: 2
  n_layers: 2
  mlp_ratio: 4.0
  dropout: 0.1
