# §5.2 TAC experiment (dryad 10.5061/dryad.4cj4k, subcritical Hopf,
# pre-extracted amplitude envelope, `envelope` alarm mode). Values pinned
# to the store.py node (see tests/config/test_yaml_alignment.py). The
# `download` block lives on the node as None (manual download via
# scripts/real_data/fetch_dryad.ps1); unused ProcessingConfig fields are
# ignored by the TAC processor (§5.1).
name: tac
source: dryad
doi: 10.5061/dryad.4cj4k
licence: CC0-1.0
bif_type: subcritical_hopf
feature_mode: envelope
archive_type: zip
parser: nptdms
expected_files:
  - path: Experimental_time_traces_tdms
    size: 0
    md5: ""
processing:
  min_length: 100
  normalization: none
  envelope: raw
  analysis_window: 4096
  channel_group: Set0
  channel_name: Mic1
  section_pattern_stationary: Stationary
  section_pattern_ramp: Ramp
  ramp_onset_detect_window: 5000
  ramp_onset_detect_factor: 3.0
  ramp_pre_samples: 2048
  ramp_post_samples: 2048
  replicate_column: replicate
  time_column: day
  count_column: count
  positive_column: treatment
  tau_annotation_days: 110
split:
  replicate_based: true
  seed: 42
  train_frac: 0.6
  val_frac: 0.2