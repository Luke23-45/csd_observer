[pytest]
testpaths = tests
markers =
    heavy: long-running reproducibility / training tests (run in the heavy lane of scripts/ci.ps1)
filterwarnings =
    ignore:.*isinstance\(treespec, LeafSpec\).*:DeprecationWarning
    ignore:.*val_dataloader.*many workers.*:UserWarning
    ignore:.*train_dataloader.*many workers.*:UserWarning
